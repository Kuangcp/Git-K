<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- git-k 应用图标：浅色圆角底 + 紫→蓝描边 K。
       assets/icon-{256,512}.png 由 `go run ./tools/genicon` 用同一几何生成。 -->
  <defs>
    <linearGradient id="iconGradient" gradientUnits="userSpaceOnUse" x1="152" y1="120" x2="360" y2="392">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="55%" stop-color="#6A7BFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FBFBFF"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#E9E7FA" stroke-width="2"/>
  <path d="M178 146V366M178 256L334 146M178 256L334 366"
        fill="none" stroke="url(#iconGradient)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
